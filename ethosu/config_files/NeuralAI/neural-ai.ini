[architecture]
clusters=1
array_dimension=32
dma_alignment=32
tcdm_size=524288
command_staging_size=4096
linebuffer_max_kernel=5
linebuffer_max_stride=2
linebuffer_max_input_width=640
requant_shift_max=31

; Preserve the current 32-byte/cycle external-memory baseline while exposing
; the U85-style burst, latency, and outstanding controls to custom configs.
[System_Config.Neural_AI]
Dram_clock_scale=1.0
Dram_burst_length=64
Dram_read_latency=500
Dram_write_latency=250
Dram_max_reads=64
Dram_max_writes=32
